name: Instagram NFL Monitor

on:
  schedule:
    # Alle 5 Minuten ausf ühren (Minimum bei GitHub Actions)
    # Cron-Syntax: Minute Stunde Tag Monat Wochentag
    - cron: '*/5 * * * *'  # Alle 5 Minuten
  workflow_dispatch:  # Manuelles Ausl ösen ermöglichen (zum Testen)

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests
      
      - name: Run Instagram Monitor
        env:
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python instagram_monitor.py
      
      - name: Commit and push seen_posts.txt (optional)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@github.com'
          git add seen_posts.txt
          git commit -m "Update seen_posts.txt" || echo "Keine Änderungen"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
